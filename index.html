<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주간 기록판">
<meta name="theme-color" content="#15181B">
<title>주간 기록판</title>
<style>
  html, body { margin: 0; padding: 0; background: #15181B; }
  body { padding-top: env(safe-area-inset-top); }
</style>
</head>
<body>
<div id="root">
  <div class="boot">불러오는 중…</div>
</div>

<style>
  :root {
    --ground: #15181B;
    --surface: #1C2126;
    --ink: #F1F4F2;
    --ink2: #B6C0C6;
    --ink3: #8B969D;
    --line: #333B42;
    --deep: #6FC5DA;
    --deep-text: #9BDCEC;
    --deep-soft: #2A3D45;
    --done: #4FBFA2;
    --signal: #E8B94E;
    --alc: #DB9271;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --kr: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
          "Malgun Gothic", system-ui, sans-serif;
  }

  #root {
    font-family: var(--kr);
    color: var(--ink);
    background: var(--ground);
    padding: 18px 14px 40px;
    max-width: 560px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  #root *, #root *::before, #root *::after { box-sizing: border-box; }

  .boot { padding: 40px 0; text-align: center; color: var(--ink3); font-family: var(--kr); }

  /* ---------- header ---------- */
  .hd { margin-bottom: 20px; }
  .hd-eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .14em;
    color: var(--ink3);
    text-transform: uppercase;
  }
  .hd-title {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -.02em;
    margin: 5px 0 0;
    line-height: 1.2;
  }
  .hd-sub {
    font-size: 14px;
    color: var(--ink2);
    margin-top: 7px;
    line-height: 1.5;
  }
  .hd-sub b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
  .sync {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 9px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 4px 9px;
  }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); }
  .sync.loading i { background: var(--signal); }
  .sync.saving i { background: var(--signal); }
  .sync.saved i { background: var(--done); }
  .sync.error i { background: var(--alc); }
  .sync.error { color: var(--alc); border-color: var(--alc); }

  /* ---------- card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px 15px;
    margin-bottom: 12px;
  }
  .card-hd {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--ink2);
  }
  .card-note { font-family: var(--mono); font-size: 12px; color: var(--ink2); }

  /* ---------- signature: lanes ---------- */
  .lane { margin-bottom: 20px; }
  .lane:last-child { margin-bottom: 2px; }
  .lane-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 9px;
  }
  .lane-name { font-size: 14px; font-weight: 600; }
  .lane-now { font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .lane-now span { font-size: 12px; color: var(--ink2); margin-left: 2px; }

  .track {
    position: relative;
    height: 30px;
    border-bottom: 1px solid var(--line);
  }
  .track-fill {
    position: absolute;
    left: 0; bottom: 0;
    height: 4px;
    background: var(--deep);
  }
  .track-rest {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: var(--deep-soft);
  }
  .track-dot {
    position: absolute;
    bottom: -3px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--deep);
    border: 2px solid var(--surface);
    transform: translateX(-50%);
    z-index: 2;
  }
  .track-goal {
    position: absolute;
    right: 0; bottom: -5px;
    width: 2px; height: 14px;
    background: var(--signal);
  }
  .track-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink2);
    letter-spacing: .02em;
  }
  .track-ends b { color: var(--signal); font-weight: 600; }
  .lane-gap { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }

  /* ---------- week strip ---------- */
  .wk-nav { display: flex; align-items: center; gap: 8px; }
  .wk-btn {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1;
    padding: 5px 8px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink2);
    cursor: pointer;
  }
  .wk-btn:hover { background: var(--ground); }
  .wk-btn[disabled] { opacity: .3; cursor: default; }

  .day {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 10px;
    padding: 11px 0;
    border-top: 1px solid var(--line);
  }
  .day:first-of-type { border-top: none; padding-top: 2px; }
  .day.is-today .day-dow { color: var(--deep); }
  .day.is-future { opacity: .45; }

  .day-mark { padding-top: 1px; }
  .day-dow {
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
  }
  .day-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink3);
    margin-top: 4px;
    display: block;
  }
  .day-fixed {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--deep-text);
    letter-spacing: .01em;
    margin-bottom: 8px;
  }
  .day-fixed.is-empty { color: var(--ink3); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip-row + .chip-row { margin-top: 6px; }
  .chip {
    font-family: var(--kr);
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink2);
    cursor: pointer;
    transition: none;
  }
  .chip:hover { border-color: var(--ink3); }
  .chip:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; }
  .chip.fix { border-style: dashed; border-color: var(--deep-soft); color: var(--deep-text); }
  .chip.on { background: var(--done); border-color: var(--done); color: #0F1416; }
  .chip.fix.on { border-style: solid; }
  .chip.alc.on { background: var(--alc); border-color: var(--alc); color: #17100C; }

  /* ---------- tally ---------- */
  .tally {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .tally-cell { background: var(--surface); padding: 11px 8px; text-align: center; }
  .tally-num { font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .tally-num.hit { color: var(--done); }
  .tally-num.over { color: var(--alc); }
  .tally-num em { font-style: normal; font-size: 12px; color: var(--ink3); font-weight: 400; }
  .tally-lb { font-size: 12px; color: var(--ink2); margin-top: 5px; }

  /* ---------- inbody ---------- */
  .in-row { display: flex; gap: 8px; align-items: flex-end; }
  .in-field { flex: 1; }
  .in-field label {
    display: block;
    font-size: 12px;
    color: var(--ink2);
    margin-bottom: 6px;
    letter-spacing: .02em;
  }
  .in-field input {
    width: 100%;
    font-family: var(--mono);
    font-size: 16px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: var(--ground);
    color: var(--ink);
  }
  .in-field input:focus { outline: 2px solid var(--deep); outline-offset: -1px; background: var(--surface); }
  .in-save {
    font-family: var(--kr);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 15px;
    border: none;
    border-radius: 2px;
    background: var(--deep);
    color: #0F1416;
    cursor: pointer;
    white-space: nowrap;
  }
  .in-save:hover { background: #67B5C8; }
  .in-msg { font-size: 12.5px; color: var(--done); margin-top: 9px; min-height: 14px; }
  .in-msg.warn { color: var(--alc); }

  .log { margin-top: 16px; border-top: 1px solid var(--line); }
  .log-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 13.5px;
  }
  .log-row .d { color: var(--ink2); font-size: 12px; }
  .log-row .v { font-weight: 600; letter-spacing: -.01em; }
  .log-row .dl { font-size: 12px; color: var(--ink3); min-width: 44px; text-align: right; }
  .log-row .dl.dn { color: var(--done); }
  .log-row .dl.up { color: var(--alc); }
  .log-empty { padding: 14px 0; font-size: 13px; color: var(--ink2); }

  .foot {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--ink2);
    line-height: 1.7;
    text-align: center;
  }
  .foot button {
    font-family: var(--kr);
    font-size: 12px;
    background: none;
    border: none;
    color: var(--ink3);
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    #root * { transition: none !important; animation: none !important; }
  }
</style>

<script>
(function () {
  // ▼▼▼ Apps Script 웹앱 URL을 여기에 붙여넣으세요 ▼▼▼
  var API = 'https://script.google.com/macros/s/AKfycbxpjM4Um6LgsXn1zS5wa72f5B-ihPyZDgl2y6WK-t3cFE4HUFyKGo_aUh7qjy1GUe0vvQ/exec';
  // ▲▲▲ 예: https://script.google.com/macros/s/AKfyc.../exec ▲▲▲

  var KEY = 'training-log-v1';
  var GOAL = { date: '2026-11-30', weight: 75.0, fat: 16.0 };
  var SEED = { date: '2026-08-17', weight: 77.4, fat: 19.5 };

  var LABEL = {
    '석식': '회사 석식',
    '배달': '배달',
    '집밥': '집밥·밀키트',
    '음주': '술',
    '하체': '하체',
    '상체': '상체',
    '재활': '재활 PT',
    '복싱': '복싱 PT',
    '새벽런': '새벽 러닝',
    '러닝': '러닝',
    '스트레칭': '스트레칭'
  };

  var PLAN = {
    1: { dow: '월', fixed: '석식 후 헬스장 직행', meal: ['석식'], train: [] },
    2: { dow: '화', fixed: '', meal: [], train: [] },
    3: { dow: '수', fixed: '재활 PT 20:00', meal: ['석식'], train: [] },
    4: { dow: '목', fixed: '복싱 PT 21:00', meal: ['석식'], train: [] },
    5: { dow: '금', fixed: '', meal: [], train: [] },
    6: { dow: '토', fixed: '', meal: [], train: [] },
    0: { dow: '일', fixed: '', meal: [], train: [] }
  };

  var data = { days: {}, inbody: [] };
  var weekOffset = 0;
  var syncState = 'idle';
  var saveTimer = null;
  var root = document.getElementById('root');

  /* ---------- date helpers ---------- */
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }
  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function mondayOf(d) {
    var x = new Date(d);
    var diff = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - diff);
    x.setHours(0, 0, 0, 0);
    return x;
  }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function weeksBetween(a, b) { return Math.max(0, Math.round((b - a) / 604800000)); }

  /* ---------- storage ---------- */
  function normalize() {
    if (!data.days) data.days = {};
    if (!data.inbody) data.inbody = [];
    if (data.inbody.length === 0) data.inbody.push(SEED);
  }

  function cache() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  var BUILD = 'v2';

  function syncLabel() {
    if (!API) return '로컬 저장 (URL 미설정)';
    if (syncState === 'loading') return '불러오는 중';
    if (syncState === 'saving') return '저장 중';
    if (syncState === 'saved') return '시트 저장됨';
    if (syncState === 'error') return '시트 연결 실패';
    return '대기';
  }

  function updateSync() {
    var el = document.getElementById('sync');
    if (!el) return;
    el.innerHTML = '<i></i>' + syncLabel() + ' · ' + BUILD;
    el.className = 'sync ' + syncState;
  }

  async function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) {}
    normalize();
    if (!API) return;
    syncState = 'loading';
    try {
      var res = await fetch(API + '?t=' + Date.now());
      var j = await res.json();
      if (j && j.days) { data = j; normalize(); cache(); syncState = 'saved'; }
      else syncState = 'error';
    } catch (e) { syncState = 'error'; }
  }

  async function save() {
    cache();
    if (!API) return;
    syncState = 'saving';
    updateSync();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(push, 700);
  }

  async function push() {
    try {
      var res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      var j = await res.json();
      syncState = (j && j.ok) ? 'saved' : 'error';
    } catch (e) { syncState = 'error'; }
    updateSync();
  }

  /* ---------- derived ---------- */
  function sorted() {
    return data.inbody.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }
  function latest() { var s = sorted(); return s[s.length - 1]; }
  function baseline() { return sorted()[0]; }

  function laneHtml(name, unit, from, now, goal, decimals) {
    var span = from - goal;
    var pct = span === 0 ? 100 : ((from - now) / span) * 100;
    pct = Math.max(0, Math.min(100, pct));
    var gap = now - goal;
    var f = function (n) { return n.toFixed(decimals); };
    return '' +
      '<div class="lane">' +
        '<div class="lane-top">' +
          '<div class="lane-name">' + name + '</div>' +
          '<div class="lane-now">' + f(now) + '<span>' + unit + '</span></div>' +
        '</div>' +
        '<div class="track">' +
          '<div class="track-rest"></div>' +
          '<div class="track-fill" style="width:' + pct + '%"></div>' +
          '<div class="track-dot" style="left:' + pct + '%"></div>' +
          '<div class="track-goal"></div>' +
        '</div>' +
        '<div class="track-ends">' +
          '<span>시작 ' + f(from) + unit + '</span>' +
          '<span class="lane-gap">' + (gap > 0 ? '남은 거리 ' + f(gap) + unit : '목표 도달') + '</span>' +
          '<span><b>목표 ' + f(goal) + unit + '</b></span>' +
        '</div>' +
      '</div>';
  }

  /* ---------- render ---------- */
  function render() {
    var t = today();
    var base = baseline();
    var last = latest();
    var wStart = addDays(mondayOf(t), weekOffset * 7);
    var wEnd = addDays(wStart, 6);
    var goalDate = parseIso(GOAL.date);
    var weeksLeft = weeksBetween(t, goalDate);

    var tally = { 석식: 0, 배달: 0, 집밥: 0, 하체: 0, 상체: 0, 러닝: 0, 스트레칭: 0, 음주: 0 };
    var daysHtml = '';

    for (var i = 0; i < 7; i++) {
      var d = addDays(wStart, i);
      var key = iso(d);
      var plan = PLAN[d.getDay()];
      var done = data.days[key] || [];
      var isToday = key === iso(t);
      var isFuture = d > t;

      var mealDefs = plan.meal.concat(['배달', '집밥', '음주']);
      var trainDefs = plan.train.concat(['하체', '상체', '재활', '복싱', '새벽런', '러닝', '스트레칭']);

      if (done.indexOf('석식') !== -1) tally.석식++;
      if (done.indexOf('배달') !== -1) tally.배달++;
      if (done.indexOf('집밥') !== -1) tally.집밥++;
      if (done.indexOf('하체') !== -1) tally.하체++;
      if (done.indexOf('상체') !== -1) tally.상체++;
      if (done.indexOf('음주') !== -1) tally.음주++;
      if (done.indexOf('스트레칭') !== -1) tally.스트레칭++;
      if (done.indexOf('새벽런') !== -1 || done.indexOf('러닝') !== -1) tally.러닝++;

      var mk = function (c) {
        var on = done.indexOf(c) !== -1;
        var extra = c === '음주' ? ' alc' : (c === '재활' || c === '복싱' ? ' fix' : '');
        return '<button class="chip' + (on ? ' on' : '') + extra +
               '" data-date="' + key + '" data-chip="' + c + '">' + LABEL[c] + '</button>';
      };
      var chipsHtml =
        '<div class="chip-row">' + mealDefs.map(mk).join('') + '</div>' +
        '<div class="chip-row">' + trainDefs.map(mk).join('') + '</div>';

      daysHtml += '' +
        '<div class="day' + (isToday ? ' is-today' : '') + (isFuture ? ' is-future' : '') + '">' +
          '<div class="day-mark">' +
            '<div class="day-dow">' + plan.dow + '</div>' +
            '<span class="day-date">' + (d.getMonth() + 1) + '.' + d.getDate() + '</span>' +
          '</div>' +
          '<div>' +
            '<div class="day-fixed' + (plan.fixed ? '' : ' is-empty') + '">' +
              (plan.fixed || '—') + '</div>' +
            chipsHtml +
          '</div>' +
        '</div>';
    }

    var logRows = sorted().slice().reverse().map(function (e, idx, arr) {
      var prev = arr[idx + 1];
      var dw = prev ? e.weight - prev.weight : null;
      var cls = dw === null ? '' : (dw < 0 ? ' dn' : (dw > 0 ? ' up' : ''));
      var dtxt = dw === null ? '—' : (dw > 0 ? '+' : '') + dw.toFixed(1);
      var dd = parseIso(e.date);
      return '<div class="log-row">' +
               '<span class="d">' + (dd.getMonth() + 1) + '.' + dd.getDate() + '</span>' +
               '<span class="v">' + e.weight.toFixed(1) + 'kg · ' + e.fat.toFixed(1) + '%</span>' +
               '<span class="dl' + cls + '">' + dtxt + '</span>' +
             '</div>';
    }).join('');

    root.innerHTML = '' +
      '<div class="hd">' +
        '<div class="hd-eyebrow">Weekly Log</div>' +
        '<h1 class="hd-title">주간 기록판</h1>' +
        '<div class="hd-sub">1차 목표 <b>11.30 · 75.0kg / 16.0%</b> · 남은 기간 <b>' +
          weeksLeft + '주</b></div>' +
        '<div id="sync" class="sync ' + syncState + '">' +
          '<i></i>' + syncLabel() + ' · ' + BUILD + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-hd">' +
          '<div class="card-title">목표까지</div>' +
          '<div class="card-note">최근 측정 ' + last.date.slice(5).replace('-', '.') + '</div>' +
        '</div>' +
        laneHtml('체중', 'kg', base.weight, last.weight, GOAL.weight, 1) +
        laneHtml('체지방률', '%', base.fat, last.fat, GOAL.fat, 1) +
      '</div>' +

      '<div class="card">' +
        '<div class="card-hd">' +
          '<div class="card-title">' + (weekOffset === 0 ? '이번 주' : (wStart.getMonth() + 1) + '월 ' + wStart.getDate() + '일 주') + '</div>' +
          '<div class="wk-nav">' +
            '<button class="wk-btn" id="prevw">←</button>' +
            '<span class="card-note">' + (wStart.getMonth() + 1) + '.' + wStart.getDate() +
              ' – ' + (wEnd.getMonth() + 1) + '.' + wEnd.getDate() + '</span>' +
            '<button class="wk-btn" id="nextw"' + (weekOffset >= 0 ? ' disabled' : '') + '>→</button>' +
          '</div>' +
        '</div>' +
        daysHtml +
      '</div>' +

      '<div class="card">' +
        '<div class="card-hd"><div class="card-title">주간 집계</div>' +
        '<div class="card-note">석식 3 · 근력 3 · 러닝 2 · 술 2</div></div>' +
        '<div class="tally">' +
          tallyCell(tally.석식, 3, '회사 석식', false) +
          tallyCell(tally.배달, null, '배달', false) +
          tallyCell(tally.집밥, null, '집밥·밀키트', false) +
          tallyCell(tally.하체, 2, '하체', false) +
          tallyCell(tally.상체, 2, '상체', false) +
          tallyCell(tally.러닝, 2, '러닝', false) +
          tallyCell(tally.스트레칭, 3, '스트레칭', false) +
          tallyCell(tally.음주, 2, '술', true) +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-hd"><div class="card-title">월요일 인바디</div>' +
        '<div class="card-note">' + iso(t).slice(5).replace('-', '.') + '</div></div>' +
        '<div class="in-row">' +
          '<div class="in-field"><label>체중 kg</label>' +
            '<input id="w" type="number" step="0.1" inputmode="decimal" placeholder="' + last.weight.toFixed(1) + '"></div>' +
          '<div class="in-field"><label>체지방률 %</label>' +
            '<input id="f" type="number" step="0.1" inputmode="decimal" placeholder="' + last.fat.toFixed(1) + '"></div>' +
          '<button class="in-save" id="savein">기록</button>' +
        '</div>' +
        '<div class="in-msg" id="msg"></div>' +
        '<div class="log">' + (logRows || '<div class="log-empty">아직 기록이 없어요.</div>') + '</div>' +
      '</div>' +

      '<div class="foot">한 일을 눌러서 켜면 돼. \'술 마심\'은 마신 날에 누르는 기록이야.<br>' +
        '<button id="backup">기록 백업</button> · ' +
        '<button id="restore">백업 불러오기</button> · ' +
        '<button id="reset">기록 전체 지우기</button></div>';

    bind();
  }

  function tallyCell(n, target, label, inverse) {
    var cls = '';
    if (target === null) cls = '';
    else if (inverse) cls = n > target ? ' over' : '';
    else cls = n >= target ? ' hit' : '';
    var suffix = target === null ? '<em>일</em>' : '<em>/' + target + '</em>';
    return '<div class="tally-cell">' +
             '<div class="tally-num' + cls + '">' + n + suffix + '</div>' +
             '<div class="tally-lb">' + label + '</div>' +
           '</div>';
  }

  function flash(text, warn) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.textContent = text;
    m.className = 'in-msg' + (warn ? ' warn' : '');
  }

  /* ---------- events ---------- */
  function bind() {
    root.querySelectorAll('.chip').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var date = btn.dataset.date, chip = btn.dataset.chip;
        var arr = data.days[date] || [];
        var i = arr.indexOf(chip);
        if (i === -1) arr.push(chip); else arr.splice(i, 1);
        if (arr.length) data.days[date] = arr; else delete data.days[date];
        render();
        await save();
      });
    });

    document.getElementById('prevw').addEventListener('click', function () {
      weekOffset--; render();
    });
    var nx = document.getElementById('nextw');
    if (!nx.disabled) nx.addEventListener('click', function () { weekOffset++; render(); });

    document.getElementById('savein').addEventListener('click', async function () {
      var w = parseFloat(document.getElementById('w').value);
      var f = parseFloat(document.getElementById('f').value);
      if (isNaN(w) || isNaN(f)) { flash('체중과 체지방률을 모두 입력해 주세요.', true); return; }
      if (w < 40 || w > 150 || f < 3 || f > 50) { flash('숫자를 다시 확인해 주세요.', true); return; }
      var key = iso(today());
      data.inbody = data.inbody.filter(function (e) { return e.date !== key; });
      data.inbody.push({ date: key, weight: w, fat: f });
      await save();
      render();
      flash('기록했어요.');
    });

    document.getElementById('backup').addEventListener('click', function () {
      var txt = JSON.stringify(data);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () {
          flash('백업 문자열을 복사했어요.');
        }, function () { prompt('아래 문자열을 복사해 두세요.', txt); });
      } else { prompt('아래 문자열을 복사해 두세요.', txt); }
    });

    document.getElementById('restore').addEventListener('click', async function () {
      var txt = prompt('백업 문자열을 붙여넣어 주세요.');
      if (!txt) return;
      try {
        var parsed = JSON.parse(txt);
        if (!parsed.days || !parsed.inbody) throw new Error('bad');
        data = parsed; normalize();
        await save(); render(); flash('백업을 불러왔어요.');
      } catch (e) { flash('문자열을 읽지 못했어요.', true); }
    });

    document.getElementById('reset').addEventListener('click', async function () {
      if (!confirm('모든 체크와 인바디 기록을 지울까요? 되돌릴 수 없어요.')) return;
      data = { days: {}, inbody: [SEED] };
      await save();
      weekOffset = 0;
      render();
    });
  }

  load().then(function () { render(); updateSync(); }).catch(function () {
    root.innerHTML = '<div class="boot">기록을 불러오지 못했어요. 새로고침해 주세요.</div>';
  });
})();
</script>

</body>
</html>
